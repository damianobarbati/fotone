name: CI

on:
  push:
    branches: [main]
    tags: [v*]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Check release version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          node --input-type=module <<'NODE'
          import manifest from './package.json' with { type: 'json' };

          const expectedTag = `v${manifest.version}`;
          if (process.env.GITHUB_REF_NAME !== expectedTag) {
            throw new Error(`Expected tag ${expectedTag} for Fotone`);
          }
          NODE

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build website
        run: pnpm -F website build

      - name: Upload website
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: packages/website/dist

  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deploy
        uses: actions/deploy-pages@v5

  darwin-arm64:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build Apple Silicon binary
        run: |
          cargo build --locked --release --manifest-path packages/fotone-rust/Cargo.toml
          packages/fotone-rust/target/release/fotone-rust --version

      - name: Upload Apple Silicon binary
        uses: actions/upload-artifact@v7
        with:
          name: fotone-darwin-arm64
          path: packages/fotone-rust/target/release/fotone-rust
          if-no-files-found: error

  linux-x64:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build Linux x64 binary
        run: |
          target_dir="$PWD/packages/fotone-rust/target/x86_64-unknown-linux-musl"
          mkdir -p "$target_dir"
          docker run --rm --platform linux/amd64 \
            --mount "type=bind,source=$PWD/packages/fotone-rust,target=/src,readonly" \
            --mount "type=bind,source=$target_dir,target=/out" \
            --workdir /src rust:1.100.0-alpine3.24 \
            cargo build --locked --release --target-dir /out
          "$target_dir/release/fotone-rust" --version

      - name: Upload Linux x64 binary
        uses: actions/upload-artifact@v7
        with:
          name: fotone-linux-x64
          path: packages/fotone-rust/target/x86_64-unknown-linux-musl/release/fotone-rust
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [darwin-arm64, linux-x64]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download Apple Silicon binary
        uses: actions/download-artifact@v8
        with:
          name: fotone-darwin-arm64
          path: packages/fotone-rust/target/release

      - name: Download Linux x64 binary
        uses: actions/download-artifact@v8
        with:
          name: fotone-linux-x64
          path: packages/fotone-rust/target/x86_64-unknown-linux-musl/release

      - name: Publish Fotone to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PNPM_CONFIG_GIT_CHECKS: "false"
        run: pnpm publish --access=public
